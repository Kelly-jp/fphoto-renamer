[workspace]
members = ["crates/core", "crates/cli", "crates/gui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.5.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
walkdir = "2.5.0"
directories = "6.0.0"
kamadak-exif = "0.6.1"
exiftool = "0.3.1"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

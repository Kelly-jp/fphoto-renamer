[workspace]
members = ["crates/core", "crates/cli", "crates/gui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.5.7"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.105"
jiff = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
walkdir = "2.5.1"
directories = "6.0.0"
kamadak-exif = "0.6.2"
clap = { version = "4.6.10", features = ["derive"] }
toml = "1.2.3"
rayon = "1.12.0"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
